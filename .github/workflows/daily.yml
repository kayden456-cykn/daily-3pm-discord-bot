name: Update Daily 3 PM Timestamp

on:
  schedule:
    # Run before 3 PM New York time in both daylight and standard time.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-time:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update Discord timestamp
        run: node bot.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
